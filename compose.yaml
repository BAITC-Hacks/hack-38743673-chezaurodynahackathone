services:
  smartmatch:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMARTMATCH_AI_PROVIDER: ${SMARTMATCH_AI_PROVIDER:-openai}
      SMARTMATCH_AI_MODEL: ${SMARTMATCH_AI_MODEL:-gpt-4.1-mini}
      SMARTMATCH_AI_TIMEOUT: ${SMARTMATCH_AI_TIMEOUT:-8}
    volumes:
      - smartmatch-data:/var/lib/smartmatch
    command: ["python", "run.py", "--host", "0.0.0.0", "--port", "8000", "--db", "/var/lib/smartmatch/smartmatch.sqlite3"]
    restart: unless-stopped

volumes:
  smartmatch-data:
